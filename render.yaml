# Render Blueprint for the Django backend (plan section 13).
# In the Render dashboard: New > Blueprint > pick this repository. Then fill in the values marked
# "sync: false" (Render asks for them): DATABASE_URL from Neon, the Vercel URL, and the LLM key.
services:
  - type: web
    name: fieldshift-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: ./build.sh
    # Free instance = 512 MB RAM / 0.1 CPU: one worker (pandas + numpy loaded once) with threads
    # for concurrency; 120 s timeout leaves room for a cold NASA POWER / SoilGrids fetch.
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-opus-5-5
      # Profile pictures. Without these, uploads go to local disk, which Render wipes on
      # every restart / spin-down.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
